name: Build, test and deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: helpdesk-api-sttallev99

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build HelpDesk.slnx -c Release

      # Integration tests need SQL Server LocalDB, which isn't available on Linux runners.
      - name: Unit tests
        run: dotnet test tests/HelpDesk.UnitTests/HelpDesk.UnitTests.csproj -c Release --no-build

      - name: Publish
        run: dotnet publish src/HelpDesk.Api/HelpDesk.Api.csproj -c Release -o ./publish --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
